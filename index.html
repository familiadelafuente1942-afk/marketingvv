<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V+V Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: #F5F6F8; color: #101C2C; }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
  button { cursor: pointer; font-family: inherit; }
  input, select, textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const SUPA_URL = "https://ipvrpdsbkfpkvfkfzlnb.supabase.co";
const SUPA_KEY = "sb_publishable_7iKBrNN68LcYZmVPLAKAvw_EBwFshs0";
const NAVY = "#101C2C";
const BRASS = "#B0894F";
const BORDER = "#E6E9EE";
const CARD = "#FFFFFF";
const SUB = "#4A5565";
const MUTE = "#8B95A5";

// ── sesión con renovación automática (lección aprendida con NEXO) ──
function tokenGuardado() { try { return localStorage.getItem("vv_token"); } catch (e) { return null; } }
function refreshGuardado() { try { return localStorage.getItem("vv_refresh"); } catch (e) { return null; } }
function guardarToken(t, r) {
  try {
    localStorage.setItem("vv_token", (t || "").trim());
    if (r) localStorage.setItem("vv_refresh", (r || "").trim());
  } catch (e) {}
}
async function renovarSesion() {
  const refresh = refreshGuardado();
  if (!refresh) return null;
  try {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refresh })
    });
    const d = await r.json();
    if (!r.ok) return null;
    guardarToken(d.access_token, d.refresh_token);
    return d.access_token;
  } catch (e) { return null; }
}
async function pedirSesion() {
  let t = tokenGuardado();
  if (t) return t;
  const renovado = await renovarSesion();
  if (renovado) return renovado;
  const email = (window.prompt("Correo:") || "").trim();
  if (!email) throw new Error("Sin correo");
  const clave = (window.prompt("Contraseña:") || "").trim();
  if (!clave) throw new Error("Sin contraseña");
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password: clave })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || "No se pudo iniciar sesión");
  guardarToken(d.access_token, d.refresh_token);
  return d.access_token;
}
// ── fetch con reintento automático + lectura segura del cuerpo (lección del bug de Safari) ──
async function vvFetch(ruta, opciones, _reintentado) {
  const t = await pedirSesion();
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${ruta}`, {
      ...opciones,
      headers: {
        apikey: SUPA_KEY,
        Authorization: `Bearer ${t}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...(opciones && opciones.headers)
      }
    });
    if (!r.ok) {
      const txt = await r.text();
      if (r.status === 401 && !_reintentado) {
        try { localStorage.removeItem("vv_token"); } catch (e) {}
        const renovado = await renovarSesion();
        if (renovado) return vvFetch(ruta, opciones, true);
      }
      throw new Error(`${r.status} · ${txt.slice(0, 200)}`);
    }
    const cuerpo = await r.text();
    return cuerpo ? JSON.parse(cuerpo) : null;
  } catch (e) {
    throw new Error(`[${ruta}] ${e.message}`);
  }
}

const ESTADOS = ["nuevo", "contactado", "reunión", "propuesta", "cerrado", "perdido"];
const COLOR_ESTADO = {
  nuevo: "#4A5565", contactado: "#9A6B1E", "reunión": "#3B6CA8",
  propuesta: BRASS, cerrado: "#2F7A4F", perdido: "#B3261E"
};

function PanelComercial() {
  const [prospectos, setProspectos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [nuevo, setNuevo] = useState(false);

  async function cargar() {
    setCargando(true);
    setError("");
    try {
      const p = await vvFetch("prospectos?select=*&order=creado.desc&limit=500");
      setProspectos(p || []);
    } catch (e) {
      setError(e.message);
    } finally {
      setCargando(false);
    }
  }
  useEffect(() => { cargar(); }, []);

  async function cambiarEstado(id, estado) {
    try {
      const body = { estado, fecha_ultimo_contacto: estado !== "nuevo" ? new Date().toISOString() : null };
      await vvFetch(`prospectos?id=eq.${id}`, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify(body) });
      setProspectos(prev => prev.map(p => p.id === id ? { ...p, ...body } : p));
    } catch (e) { setError(e.message); }
  }
  async function borrar(id) {
    if (!window.confirm("¿Borrar este contacto?")) return;
    try {
      await vvFetch(`prospectos?id=eq.${id}`, { method: "DELETE", headers: { Prefer: "return=minimal" } });
      setProspectos(prev => prev.filter(p => p.id !== id));
    } catch (e) { setError(e.message); }
  }

  function FormNuevo() {
    const [f, setF] = useState({ nombre_contacto: "", empresa: "", email: "", telefono: "", tipo_proyecto: "construcción", zona: "", origen: "" });
    async function guardar() {
      if (!f.nombre_contacto.trim() && !f.empresa.trim()) return;
      try {
        const [fila] = await vvFetch("prospectos", { method: "POST", body: JSON.stringify(f) });
        setProspectos(prev => [fila, ...prev]);
        setNuevo(false);
      } catch (e) { setError(e.message); }
    }
    const campo = { padding: "10px 12px", borderRadius: 8, border: `1px solid ${BORDER}`, fontSize: 13 };
    return (
      <div style={{ background: "#F5F6F8", borderRadius: 11, padding: 14, marginBottom: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input placeholder="Nombre de contacto" value={f.nombre_contacto} onChange={e => setF({ ...f, nombre_contacto: e.target.value })} style={{ ...campo, flex: "1 1 160px" }} />
        <input placeholder="Empresa (opcional)" value={f.empresa} onChange={e => setF({ ...f, empresa: e.target.value })} style={{ ...campo, flex: "1 1 160px" }} />
        <input placeholder="Mail" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} style={{ ...campo, flex: "1 1 160px" }} />
        <input placeholder="Teléfono" value={f.telefono} onChange={e => setF({ ...f, telefono: e.target.value })} style={{ ...campo, flex: "1 1 130px" }} />
        <select value={f.tipo_proyecto} onChange={e => setF({ ...f, tipo_proyecto: e.target.value })} style={campo}>
          {["construcción", "remodelación", "ampliación", "otro"].map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <input placeholder="Zona" value={f.zona} onChange={e => setF({ ...f, zona: e.target.value })} style={{ ...campo, width: 130 }} />
        <button onClick={guardar} style={{ border: "none", borderRadius: 20, padding: "10px 18px", background: BRASS, color: "#fff", fontWeight: 700, fontSize: 12.5 }}>Agregar</button>
      </div>
    );
  }

  const th = { textAlign: "left", fontSize: 9.5, fontWeight: 700, letterSpacing: ".08em", textTransform: "uppercase", color: MUTE, padding: "0 10px 8px" };
  const td = { padding: "10px", fontSize: 12.5, color: "#1A1A1A", borderTop: `1px solid #EEF0F3` };

  return (
    <div style={{ maxWidth: 1000, margin: "0 auto", padding: "28px 20px" }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: ".12em", color: BRASS, textTransform: "uppercase", marginBottom: 6 }}>V+V · Comercial</div>
        <h1 style={{ fontSize: 26, fontWeight: 600 }}>Prospectos para construir</h1>
      </div>
      <div style={{ background: CARD, borderRadius: 13, border: `1px solid ${BORDER}`, padding: "18px 20px" }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 14, alignItems: "center" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: NAVY }}>{prospectos.length} contacto{prospectos.length === 1 ? "" : "s"}</div>
          <button onClick={() => setNuevo(v => !v)} style={{ border: "none", borderRadius: 20, padding: "8px 16px", background: "#EAF3EC", color: "#2F7A4F", fontWeight: 700, fontSize: 11, marginLeft: "auto" }}>{nuevo ? "Cancelar" : "+ Nuevo"}</button>
        </div>
        {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 9, padding: "9px 12px", fontSize: 12, marginBottom: 12 }}>{error}</div>}
        {nuevo && <FormNuevo />}
        {cargando ? <div style={{ fontSize: 12.5, color: MUTE }}>Cargando…</div> :
          prospectos.length === 0 ? <div style={{ fontSize: 12.5, color: MUTE }}>Sin contactos cargados todavía.</div> :
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr>
                <th style={th}>Contacto</th><th style={th}>Tipo</th><th style={th}>Zona</th>
                <th style={th}>Mail</th><th style={th}>Estado</th><th style={th}></th>
              </tr></thead>
              <tbody>
                {prospectos.map(p => (
                  <tr key={p.id}>
                    <td style={td}><div>{p.nombre_contacto || "—"}</div>{p.empresa && <div style={{ fontSize: 10.5, color: MUTE }}>{p.empresa}</div>}</td>
                    <td style={td}>{p.tipo_proyecto || "—"}</td>
                    <td style={td}>{p.zona || "—"}</td>
                    <td style={td}>{p.email || "—"}</td>
                    <td style={td}>
                      <select value={p.estado} onChange={e => cambiarEstado(p.id, e.target.value)} style={{ fontSize: 11.5, padding: "4px 6px", borderRadius: 6, border: `1px solid ${BORDER}`, color: COLOR_ESTADO[p.estado] }}>
                        {ESTADOS.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                    <td style={td}><button onClick={() => borrar(p.id)} style={{ border: "none", background: "none", color: "#B3261E", cursor: "pointer", fontSize: 11.5 }}>Borrar</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>}
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{ minHeight: "100vh" }}>
      <div style={{ background: NAVY, padding: "14px 20px" }}>
        <div style={{ maxWidth: 1000, margin: "0 auto", color: "#fff", fontFamily: "'Fraunces',serif", fontWeight: 600, fontSize: 17 }}>V+V <span style={{ color: BRASS }}>Marketing</span></div>
      </div>
      <PanelComercial />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
