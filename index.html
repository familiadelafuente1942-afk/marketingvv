<title>V+V Construcciones — Experiencia, Orden y Eficiencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.production.min.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', sans-serif; background: #F5F6F8; color: #101C2C; }
h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }

/* ═══════ Landing pública (paleta industrial propia, separada del Centro de Operaciones) ═══════ */
.lp {
  --hormigon: #F5F6F8; --hormigon-osc: #EAEEF4; --piedra: #E4E9F0; --carbon: #101C2C;
  --oxido: #B0894F; --acero: #5B6B85; --acero-claro: #9AA7BC; --linea: rgba(16,28,44,.13);
  font-family: 'Archivo', 'Inter', sans-serif; background: var(--hormigon); color: var(--carbon); line-height: 1.5;
}
.lp h1, .lp h2, .lp h3, .lp .display { font-family: 'Archivo Expanded', 'Fraunces', sans-serif; font-weight: 800; letter-spacing: -0.01em; line-height: 0.98; }
.lp .medida { font-weight: 600; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--oxido); }
.lp a { color: inherit; }
.lp img { max-width: 100%; display: block; }
.lp .marco { position: relative; border: 1px solid var(--linea); }
.lp header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; border-bottom: 1px solid var(--linea); }
.lp .logo { font-family: 'Archivo Expanded', 'Fraunces', sans-serif; font-weight: 800; font-size: 20px; }
.lp .logo span { color: var(--oxido); }
.lp nav { display: flex; gap: 32px; font-size: 13px; font-weight: 600; }
.lp nav a { text-decoration: none; opacity: .75; }
.lp .btn { display: inline-block; background: var(--oxido); color: #fff; padding: 12px 22px; font-size: 12.5px; font-weight: 700; border: none; text-decoration: none; letter-spacing: .02em; }
.lp .btn-linea { display: inline-block; border: 1.5px solid var(--carbon); padding: 10.5px 22px; font-size: 12.5px; font-weight: 700; text-decoration: none; }
.lp .hero { padding: 90px 40px 70px; }
.lp .hero-grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 60px; align-items: end; }
.lp .hero h1 { font-size: clamp(46px, 6.2vw, 84px); }
.lp .hero h1 .oxido { color: var(--oxido); }
.lp .hero p.lead { font-size: 17px; color: #3D4A5C; max-width: 440px; margin-top: 22px; }
.lp .hero-cta { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
.lp .hero-cifras { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--linea); margin-top: 60px; max-width: 1180px; margin-left: auto; margin-right: auto; }
.lp .cifra { padding: 22px 0; border-right: 1px solid var(--linea); }
.lp .cifra:last-child { border-right: none; }
.lp .cifra .n { font-family: 'Archivo Expanded', 'Fraunces', sans-serif; font-weight: 800; font-size: 38px; color: var(--oxido); }
.lp .cifra .l { font-size: 11.5px; color: var(--acero); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-top: 4px; }
.lp section { padding: 80px 40px; max-width: 1180px; margin: 0 auto; }
.lp .eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.lp .eyebrow .num { font-family: 'Archivo Expanded', 'Fraunces', sans-serif; font-weight: 800; font-size: 13px; color: var(--oxido); }
.lp .eyebrow .txt { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--acero); }
.lp .eyebrow .raya { flex: 1; height: 1px; background: var(--linea); }
.lp .servicios { background: var(--piedra); }
.lp .servicios h2 { font-size: clamp(30px, 4vw, 46px); max-width: 640px; margin-bottom: 46px; }
.lp .grid-servicios { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1px; background: var(--linea); }
.lp .servicio { background: var(--piedra); padding: 30px 26px; }
.lp .servicio h3 { font-size: 21px; margin: 14px 0 10px; font-weight: 700; }
.lp .servicio p { font-size: 13.5px; color: #445269; }
.lp .portfolio h2 { font-size: clamp(30px, 4vw, 46px); max-width: 600px; }
.lp .portfolio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 40px; }
.lp .obra { position: relative; aspect-ratio: 4/5; overflow: hidden; }
.lp .obra .ph { width: 100%; height: 100%; object-fit: cover; }
.lp .obra .info { position: absolute; left: 0; bottom: 0; right: 0; padding: 18px; background: linear-gradient(to top, rgba(243,240,233,.92), transparent); }
.lp .obra .info h3 { font-size: 17px; margin-top: 6px; font-weight: 700; }
.lp .cita { background: var(--hormigon-osc); }
.lp .cita blockquote { font-family: 'Archivo Expanded', 'Fraunces', sans-serif; font-weight: 700; font-size: clamp(24px, 3.6vw, 38px); max-width: 780px; line-height: 1.25; margin: 0; }
.lp .cita .firma { margin-top: 26px; font-size: 13px; color: var(--acero); }
.lp .cita .firma b { color: var(--carbon); }
.lp .contacto { text-align: center; padding-bottom: 60px; }
.lp .contacto h2 { font-size: clamp(32px, 5vw, 56px); max-width: 700px; margin: 0 auto 26px; }
.lp .contacto p { color: var(--acero); max-width: 480px; margin: 0 auto 34px; font-size: 14.5px; }
.lp .form-contacto { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.lp .form-contacto input, .lp .form-contacto select { padding: 12px 14px; border-radius: 4px; border: 1px solid var(--linea); font-size: 14px; background: #fff; }
.lp footer { border-top: 1px solid var(--linea); padding: 26px 40px; display: flex; justify-content: space-between; font-size: 12px; color: var(--acero); flex-wrap: wrap; gap: 10px; }
.lp footer .acceso-interno { color: var(--acero); opacity: .55; text-decoration: none; font-size: 10.5px; }
@media (max-width: 900px) {
  .lp .hero-grid { grid-template-columns: 1fr; }
  .lp .hero-cifras { grid-template-columns: 1fr; }
  .lp .cifra { border-right: none; border-bottom: 1px solid var(--linea); }
  .lp .portfolio-grid { grid-template-columns: 1fr; }
  .lp nav { display: none; }
  .lp header, .lp section { padding-left: 20px; padding-right: 20px; }
}

/* ═══════ Landing VIP Deco & Home (paleta cálida y minimal, propia) ═══════ */
.ld {
  --crema: #F7F3EC; --crema-osc: #EFE8DA; --piedra: #E6DDCB; --negro: #1A1714;
  --terra: #A9673C; --arena: #C9BBA0; --linea: rgba(26,23,20,.12);
  font-family: 'Inter', sans-serif; background: var(--crema); color: var(--negro); line-height: 1.55;
}
.ld h1, .ld h2, .ld h3 { font-family: 'Fraunces', serif; font-weight: 400; letter-spacing: -0.01em; line-height: 1.05; }
.ld .medida { font-weight: 600; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--terra); }
.ld a { color: inherit; }
.ld img { max-width: 100%; display: block; }
.ld header { display: flex; align-items: center; justify-content: space-between; padding: 26px 40px; }
.ld .logo { font-family: 'Fraunces', serif; font-weight: 500; font-size: 19px; letter-spacing: .01em; }
.ld nav { display: flex; gap: 30px; font-size: 12.5px; font-weight: 500; }
.ld nav a { text-decoration: none; opacity: .7; }
.ld .btn { display: inline-block; background: var(--negro); color: var(--crema); padding: 13px 24px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border: none; text-decoration: none; }
.ld .btn-linea { display: inline-block; border: 1px solid var(--negro); padding: 12px 24px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.ld .hero { padding: 70px 40px 60px; }
.ld .hero-grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 60px; align-items: center; }
.ld .hero h1 { font-size: clamp(38px, 5.4vw, 64px); }
.ld .hero p.lead { font-size: 16px; color: #4A433C; max-width: 420px; margin-top: 20px; }
.ld .hero-cta { display: flex; gap: 14px; margin-top: 30px; flex-wrap: wrap; }
.ld section { padding: 70px 40px; max-width: 1180px; margin: 0 auto; }
.ld .eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.ld .eyebrow .txt { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--terra); }
.ld .eyebrow .raya { flex: 1; height: 1px; background: var(--linea); }
.ld .colecciones h2, .ld .categorias h2, .ld .productos h2 { font-size: clamp(28px, 3.6vw, 40px); max-width: 600px; margin-bottom: 40px; }
.ld .grid-colecciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: var(--linea); border: 1px solid var(--linea); }
.ld .coleccion { background: var(--crema); padding: 32px 26px; }
.ld .coleccion h3 { font-size: 22px; margin: 6px 0 10px; }
.ld .coleccion p { font-size: 13.5px; color: #5A5347; }
.ld .grid-categorias { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.ld .categoria { position: relative; aspect-ratio: 1/1; overflow: hidden; background: var(--piedra); }
.ld .categoria img { width: 100%; height: 100%; object-fit: cover; }
.ld .categoria .nombre { position: absolute; left: 0; bottom: 0; right: 0; padding: 14px; background: linear-gradient(to top, rgba(26,23,20,.75), transparent); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.ld .grid-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 22px; margin-top: 40px; }
.ld .producto img { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: var(--piedra); }
.ld .producto h3 { font-size: 14px; font-weight: 600; margin-top: 12px; }
.ld .producto .precio { font-size: 13px; color: var(--terra); margin-top: 4px; }
.ld .cita { background: var(--negro); color: var(--crema); }
.ld .cita blockquote { font-family: 'Fraunces', serif; font-weight: 400; font-style: italic; font-size: clamp(22px, 3.2vw, 34px); max-width: 760px; line-height: 1.3; margin: 0; }
.ld .cita .firma { margin-top: 24px; font-size: 12.5px; color: var(--arena); }
.ld .contacto { text-align: center; }
.ld .contacto h2 { font-size: clamp(28px, 4.2vw, 46px); max-width: 640px; margin: 0 auto 22px; }
.ld .contacto p { color: #6B6355; max-width: 460px; margin: 0 auto 30px; font-size: 14px; }
.ld .form-contacto { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.ld .form-contacto input, .ld .form-contacto select { padding: 12px 14px; border-radius: 2px; border: 1px solid var(--linea); font-size: 14px; background: #fff; }
.ld footer { border-top: 1px solid var(--linea); padding: 26px 40px; display: flex; justify-content: space-between; font-size: 11.5px; color: #6B6355; flex-wrap: wrap; gap: 10px; }
.ld footer .acceso-interno { color: #6B6355; opacity: .55; text-decoration: none; font-size: 10px; }
@media (max-width: 900px) {
  .ld .hero-grid { grid-template-columns: 1fr; }
  .ld nav { display: none; }
  .ld header, .ld section { padding-left: 20px; padding-right: 20px; }
}
</style>

function tokenGuardado() { try { return localStorage.getItem("vv_token"); } catch (e) { return null; } }
function refreshGuardado() { try { return localStorage.getItem("vv_refresh"); } catch (e) { return null; } }
function guardarToken(t, r) {
  try {
    localStorage.setItem("vv_token", (t || "").trim());
    if (r) localStorage.setItem("vv_refresh", (r || "").trim());
  } catch (e) {}
}
function cerrarSesion() {
  try {
    localStorage.removeItem("vv_token");
    localStorage.removeItem("vv_refresh");
  } catch (e) {}
}
async function renovarSesion() {

      headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refresh })
    });
    const d = await r.json();
    if (!r.ok) return null;
    guardarToken(d.access_token, d.refresh_token);
    return d.access_token;
  } catch (e) { return null; }
}
async function iniciarSesionConCredenciales(email, clave) {
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password: clave })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || "No se pudo iniciar sesión");
  guardarToken(d.access_token, d.refresh_token);
  return d.access_token;
}
async function pedirSesion() {
  // el login con correo/contraseña se resuelve antes con la pantalla LoginForm;
  // acá solo se usa el token ya guardado, renovándolo si hace falta.
  let t = tokenGuardado();
  if (t) return t;
  const renovado = await renovarSesion();
  if (renovado) return renovado;
  throw new Error("Sesión vencida — iniciá sesión de nuevo");
}

// ── fetch con reintento automático + lectura segura del cuerpo (bug de Safari) ──
async function vvFetch(ruta, opciones, _reintentado) {
  const t = await pedirSesion();
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${ruta}`, {
      ...opciones,
      headers: {
        apikey: SUPA_KEY,
        Authorization: `Bearer ${t}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...(opciones && opciones.headers)
      }
    });
    if (!r.ok) {
      const txt = await r.text();
      if (r.status === 401 && !_reintentado) {
        try { localStorage.removeItem("vv_token"); } catch (e) {}
        const renovado = await renovarSesion();
        if (renovado) return vvFetch(ruta, opciones, true);
      }
      throw new Error(`${r.status} · ${txt.slice(0, 200)}`);
    }
    const cuerpo = await r.text();
    return cuerpo ? JSON.parse(cuerpo) : null;
  } catch (e) {
    throw new Error(`[${ruta}] ${e.message}`);
  }
}

// ── componente genérico de lista con alta / cambio de estado / borrado ──
function ListaGenerica({ tabla, campos, estadoCampo, estadoOpciones, colorEstado, ordenarPor, onData, etiqueta, filtro }) {
  const [filas, setFilas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [nuevo, setNuevo] = useState(false);
  const vacio = campos.reduce((acc, c) => ({ ...acc, [c.key]: (filtro && filtro.campo === c.key) ? filtro.valor : c.tipo === "number" ? 0 : c.tipo === "select" ? c.opciones[0] : "" }), estadoCampo ? { [estadoCampo]: estadoOpciones[0] } : {});
  const [f, setF] = useState(vacio);

  async function cargar() {
    setCargando(true);
    setError("");
    try {
      const orden = ordenarPor || "creado";
      const p = await vvFetch(`${tabla}?select=*&order=${orden}.desc&limit=500`);
      setFilas(p || []);
      if (onData) onData(p || []);
    } catch (e) { setError(e.message); }
    finally { setCargando(false); }
  }
  useEffect(() => { cargar(); }, []);

  async function guardar() {
    const primero = campos[0].key;
    if (!String(f[primero] || "").trim()) return;
    try {
      const body = filtro ? { ...f, [filtro.campo]: filtro.valor } : f;
      const [fila] = await vvFetch(tabla, { method: "POST", body: JSON.stringify(body) });
      const nuevas = [fila, ...filas];
      setFilas(nuevas);
      if (onData) onData(nuevas);
      setF(vacio);
      setNuevo(false);
    } catch (e) { setError(e.message); }
  }

  async function cambiarEstado(id, valor) {
    try {
      const body = { [estadoCampo]: valor };
      await vvFetch(`${tabla}?id=eq.${id}`, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify(body) });
      const nuevas = filas.map(x => x.id === id ? { ...x, ...body } : x);
      setFilas(nuevas);
      if (onData) onData(nuevas);
    } catch (e) { setError(e.message); }
  }

  async function borrar(id) {
    if (!window.confirm("¿Borrar este registro?")) return;
    try {
      await vvFetch(`${tabla}?id=eq.${id}`, { method: "DELETE", headers: { Prefer: "return=minimal" } });
      const nuevas = filas.filter(x => x.id !== id);
      setFilas(nuevas);
      if (onData) onData(nuevas);
    } catch (e) { setError(e.message); }
  }

  const filasVisibles = filtro ? filas.filter(x => x[filtro.campo] === filtro.valor) : filas;

  return (
    <Tarjeta>
      <div style={{ display: "flex", gap: 8, marginBottom: 14, alignItems: "center" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: NAVY }}>{filasVisibles.length} {etiqueta}{filasVisibles.length === 1 ? "" : "s"}</div>
        <button onClick={() => setNuevo(v => !v)} style={btnNuevo}>{nuevo ? "Cancelar" : "+ Nuevo"}</button>
      </div>
      {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 9, padding: "9px 12px", fontSize: 12, marginBottom: 12 }}>{error}</div>}
      {nuevo && (
        <div style={{ background: FONDO, borderRadius: 11, padding: 14, marginBottom: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
          {campos.map(c => (
            c.tipo === "select" ? (
              <select key={c.key} value={f[c.key]} onChange={e => setF({ ...f, [c.key]: e.target.value })} style={campoEstilo}>
                {c.opciones.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            ) : (
              <input key={c.key} type={c.tipo === "number" ? "number" : c.tipo === "date" ? "date" : "text"}
                placeholder={c.label} value={f[c.key]}
                onChange={e => setF({ ...f, [c.key]: c.tipo === "number" ? Number(e.target.value) : e.target.value })}
                style={{ ...campoEstilo, flex: c.ancho || "1 1 160px" }} />
            )
          ))}
          <button onClick={guardar} style={btnBrass}>Agregar</button>
        </div>
      )}
      {cargando ? <div style={{ fontSize: 12.5, color: MUTE }}>Cargando…</div> :
        filasVisibles.length === 0 ? <div style={{ fontSize: 12.5, color: MUTE }}>Sin registros todavía.</div> :
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead><tr>
              {campos.map(c => <th key={c.key} style={th}>{c.label}</th>)}
              {estadoCampo && <th style={th}>{estadoCampo === "etapa" ? "Etapa" : "Estado"}</th>}
              <th style={th}></th>
            </tr></thead>
            <tbody>
              {filasVisibles.map(x => (
                <tr key={x.id}>
                  {campos.map(c => <td key={c.key} style={td}>{x[c.key] || "—"}</td>)}
                  {estadoCampo && (
                    <td style={td}>
                      <select value={x[estadoCampo]} onChange={e => cambiarEstado(x.id, e.target.value)}
                        style={{ fontSize: 11.5, padding: "4px 6px", borderRadius: 6, border: `1px solid ${BORDER}`, color: (colorEstado && colorEstado[x[estadoCampo]]) || NAVY }}>
                        {estadoOpciones.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </td>
                  )}
                  <td style={td}><button onClick={() => borrar(x.id)} style={{ border: "none", background: "none", color: "#B3261E", cursor: "pointer", fontSize: 11.5 }}>Borrar</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}
    </Tarjeta>
  );
}

function SubTabs({ tabs, actual, onCambiar }) {
  return (
    <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
      {tabs.map(t => (
        <button key={t.id} onClick={() => onCambiar(t.id)}
          style={{
            border: "none", borderRadius: 20, padding: "8px 16px", fontSize: 12, fontWeight: 700,
            background: actual === t.id ? NAVY : "#EDEFF3", color: actual === t.id ? "#fff" : SUB
          }}>{t.label}</button>
      ))}
    </div>
  );
}

const ESTADOS_PROSPECTO = ["nuevo", "contactado", "reunión", "propuesta", "cerrado", "perdido"];
const COLOR_PROSPECTO = { nuevo: "#4A5565", contactado: "#9A6B1E", "reunión": "#3B6CA8", propuesta: BRASS, cerrado: "#2F7A4F", perdido: "#B3261E" };

function PanelComercial({ onData, marca }) {
  const [prospectos, setProspectos] = useState([]);

  const [error, setError] = useState("");

  async function cargar() {
    setCargando(true); setError("");
    try {
      const p = await vvFetch("prospectos?select=*&order=creado.desc&limit=500");
      setProspectos(p || []);
      if (onData) onData(p || []);
    } catch (e) { setError(e.message); }

  }
  useEffect(() => { cargar(); }, []);

  const visibles = prospectos.filter(p => (p.marca || "V+V Construcciones") === marca);

  async function cambiarEstado(id, estado) {
    try {
      const body = { estado, fecha_ultimo_contacto: estado !== "nuevo" ? new Date().toISOString() : null };
      await vvFetch(`prospectos?id=eq.${id}`, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify(body) });
      const nuevas = prospectos.map(p => p.id === id ? { ...p, ...body } : p);
      setProspectos(nuevas);
      if (onData) onData(nuevas);
    } catch (e) { setError(e.message); }
  }
  async function borrar(id) {
    if (!window.confirm("¿Borrar este contacto?")) return;
    try {
      await vvFetch(`prospectos?id=eq.${id}`, { method: "DELETE", headers: { Prefer: "return=minimal" } });
      const nuevas = prospectos.filter(p => p.id !== id);
      setProspectos(nuevas);
      if (onData) onData(nuevas);
    } catch (e) { setError(e.message); }
  }

  function FormNuevo() {
    const [f, setF] = useState({ nombre_contacto: "", empresa: "", email: "", telefono: "", tipo_proyecto: marca === "VIP Deco & Home" ? "interiorismo/decoración" : "construcción", zona: "", origen: "" });
    async function guardar() {
      if (!f.nombre_contacto.trim() && !f.empresa.trim()) return;
      try {
        const [fila] = await vvFetch("prospectos", { method: "POST", body: JSON.stringify({ ...f, marca }) });
        const nuevas = [fila, ...prospectos];
        setProspectos(nuevas);
        if (onData) onData(nuevas);
        setNuevo(false);
      } catch (e) { setError(e.message); }
    }
    return (
      <div style={{ background: FONDO, borderRadius: 11, padding: 14, marginBottom: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input placeholder="Nombre de contacto" value={f.nombre_contacto} onChange={e => setF({ ...f, nombre_contacto: e.target.value })} style={{ ...campoEstilo, flex: "1 1 160px" }} />
        <input placeholder="Empresa (opcional)" value={f.empresa} onChange={e => setF({ ...f, empresa: e.target.value })} style={{ ...campoEstilo, flex: "1 1 160px" }} />
        <input placeholder="Mail" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} style={{ ...campoEstilo, flex: "1 1 160px" }} />
        <input placeholder="Teléfono" value={f.telefono} onChange={e => setF({ ...f, telefono: e.target.value })} style={{ ...campoEstilo, flex: "1 1 130px" }} />
        <select value={f.tipo_proyecto} onChange={e => setF({ ...f, tipo_proyecto: e.target.value })} style={campoEstilo}>
          {["construcción", "remodelación", "ampliación", "interiorismo/decoración", "otro"].map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <input placeholder="Zona" value={f.zona} onChange={e => setF({ ...f, zona: e.target.value })} style={{ ...campoEstilo, width: 130 }} />
        <button onClick={guardar} style={btnBrass}>Agregar</button>
      </div>
    );
  }

  return (
    <div>
      <Encabezado area="Comercial" titulo={marca === "VIP Deco & Home" ? "Prospectos de VIP Deco & Home" : "Prospectos para construir"} />
      <Tarjeta>
        <div style={{ display: "flex", gap: 8, marginBottom: 14, alignItems: "center" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: NAVY }}>{visibles.length} contacto{visibles.length === 1 ? "" : "s"}</div>
          <button onClick={() => setNuevo(v => !v)} style={btnNuevo}>{nuevo ? "Cancelar" : "+ Nuevo"}</button>
        </div>
        {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 9, padding: "9px 12px", fontSize: 12, marginBottom: 12 }}>{error}</div>}
        {nuevo && <FormNuevo />}
        {cargando ? <div style={{ fontSize: 12.5, color: MUTE }}>Cargando…</div> :
          visibles.length === 0 ? <div style={{ fontSize: 12.5, color: MUTE }}>Sin contactos cargados todavía.</div> :
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr>
                <th style={th}>Contacto</th><th style={th}>Tipo</th><th style={th}>Zona</th>
                <th style={th}>Mail</th><th style={th}>Estado</th><th style={th}></th>
              </tr></thead>
              <tbody>
                {visibles.map(p => (
                  <tr key={p.id}>
                    <td style={td}><div>{p.nombre_contacto || "—"}</div>{p.empresa && <div style={{ fontSize: 10.5, color: MUTE }}>{p.empresa}</div>}</td>
                    <td style={td}>{p.tipo_proyecto || "—"}</td>
                    <td style={td}>{p.zona || "—"}</td>
                    <td style={td}>{p.email || "—"}</td>
                    <td style={td}>
                      <select value={p.estado} onChange={e => cambiarEstado(p.id, e.target.value)} style={{ fontSize: 11.5, padding: "4px 6px", borderRadius: 6, border: `1px solid ${BORDER}`, color: COLOR_PROSPECTO[p.estado] }}>
                        {ESTADOS_PROSPECTO.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                    <td style={td}><button onClick={() => borrar(p.id)} style={{ border: "none", background: "none", color: "#B3261E", cursor: "pointer", fontSize: 11.5 }}>Borrar</button></td>
                  </tr>
                ))}

            </table>
          </div>}
      </Tarjeta>
    </div>
  );

async function obtenerConfigMarca(marca) {
  const r = await fetch(`${SUPA_URL}/rest/v1/config_marca?marca=eq.${encodeURIComponent(marca)}&select=*`, {
    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
  });
  if (!r.ok) return null;
  const filas = await r.json();
  return filas && filas[0] ? filas[0] : null;
}

async function insertarProspectoPublico(datos) {
  const r = await fetch(`${SUPA_URL}/rest/v1/prospectos`, {
    method: "POST",
    headers: {
      apikey: SUPA_KEY,
      Authorization: `Bearer ${SUPA_KEY}`,
      "Content-Type": "application/json",
      Prefer: "return=minimal"
    },
    body: JSON.stringify(datos)
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`${r.status} · ${txt.slice(0, 200)}`);
  }
}

function FormularioContacto() {
  const [f, setF] = useState({ nombre_contacto: "", email: "", telefono: "", tipo_proyecto: "construcción", zona: "" });
  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado] = useState(false);
  const [error, setError] = useState("");

  async function enviar(e) {
    e.preventDefault();
    if (!f.nombre_contacto.trim()) return;
    setEnviando(true); setError("");
    try {
      await insertarProspectoPublico({ ...f, marca: "V+V Construcciones", estado: "nuevo", origen: "web" });
      setEnviado(true);
    } catch (err) { setError(err.message); }
    finally { setEnviando(false); }
  }

  if (enviado) {
    return <div style={{ background: "#EAF3EC", color: "#2F7A4F", borderRadius: 6, padding: "16px 18px", fontSize: 14, fontWeight: 600 }}>¡Gracias! Te vamos a contactar a la brevedad.</div>;
  }

  return (
    <form onSubmit={enviar} className="form-contacto">
      {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 6, padding: "9px 12px", fontSize: 12.5 }}>{error}</div>}

  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado] = useState(false);
  const [error, setError] = useState("");

  async function enviar(e) {
    e.preventDefault();
    if (!f.nombre_contacto.trim()) return;
    setEnviando(true); setError("");
    try {
      await insertarProspectoPublico({ ...f, marca: "VIP Deco & Home", estado: "nuevo", origen: "web vip deco" });
      setEnviado(true);
    } catch (err) { setError(err.message); }
    finally { setEnviando(false); }
  }

  if (enviado) {
    return <div style={{ background: "#1A1714", color: "#F7F3EC", borderRadius: 2, padding: "16px 18px", fontSize: 14, fontWeight: 500 }}>¡Gracias! Te contactamos a la brevedad.</div>;
  }

  return (
    <form onSubmit={enviar} className="form-contacto">
      {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 4, padding: "9px 12px", fontSize: 12.5 }}>{error}</div>}

      <input type="email" placeholder="Mail" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} />
      <input placeholder="Teléfono" value={f.telefono} onChange={e => setF({ ...f, telefono: e.target.value })} />
      <select value={f.tipo_proyecto} onChange={e => setF({ ...f, tipo_proyecto: e.target.value })}>

      <input placeholder="Zona" value={f.zona} onChange={e => setF({ ...f, zona: e.target.value })} />

    </form>
  );

const MAPA_RUTA = { "": "vv", "#deco": "deco", "#operaciones": "operaciones" };

function Sitio() {
  const [vista, setVista] = useState(MAPA_RUTA[window.location.hash] || "vv");

  function irA(id) {
    setVista(id);
    const hash = id === "vv" ? "" : "#" + id;
    try { window.history.replaceState(null, "", window.location.pathname + hash); } catch (e) {}
  }

  useEffect(() => {
    const f = () => {
      const h = window.location.hash;
      if (Object.prototype.hasOwnProperty.call(MAPA_RUTA, h)) setVista(MAPA_RUTA[h]);
      // si no, es un ancla interna de sección (ej. #contacto-deco) — no cambiar de vista
    };
    window.addEventListener("hashchange", f);
    return () => window.removeEventListener("hashchange", f);
  }, []);

  return (
    <div>
      <SelectorApp activo={vista} onCambiar={irA} />
      {vista === "vv" && <Landing />}
      {vista === "deco" && <LandingDeco />}
      {vista === "operaciones" && <CentroOperaciones />}
    </div>
  );
}

async function preguntarleAlAsistente(mensajes, marca) {
  let r;
  try {
    r = await fetch("/api/asistente", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensajes, marca })
    });
  } catch (e) {
    throw new Error(`No se pudo conectar con /api/asistente: ${e.message}`);
  }
  const textoCrudo = await r.text();
  let data;
  try {
    data = JSON.parse(textoCrudo);
  } catch (e) {
    throw new Error(`Respuesta no-JSON (status ${r.status}): ${textoCrudo.slice(0, 300)}`);
  }
  if (!r.ok) throw new Error(`(status ${r.status}) ${data.error || "Error del asistente"}`);
  return { texto: data.texto, empresas: data.empresas || [], grupos: data.grupos || [] };
}

function PanelAsistente({ prospectos, campanas, grupos, marca }) {
  const [mensajes, setMensajes] = useState([]); // [{ role: "user"|"assistant", contenido }]
  const [cargandoHistorial, setCargandoHistorial] = useState(true);
  const [prompt, setPrompt] = useState("");
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState("");
  const [copiadoIdx, setCopiadoIdx] = useState(null);
  const [escuchando, setEscuchando] = useState(false);
  const [hablandoIdx, setHablandoIdx] = useState(null);
  const [nota, setNota] = useState("");
  const reconocimientoRef = React.useRef(null);
  const utteranceRef = React.useRef(null);
  const timeoutSeguridadRef = React.useRef(null);
  const intervaloResumeRef = React.useRef(null);
  const finRef = React.useRef(null);

  const MotorVoz = window.SpeechRecognition || window.webkitSpeechRecognition;
  const soportaDictado = !!MotorVoz;
  const soportaLectura = !!window.speechSynthesis;

  async function cargarHistorial() {
    setCargandoHistorial(true);
    try {
      const filas = await vvFetch(`chat_mensajes?marca=eq.${encodeURIComponent(marca)}&select=*&order=creado.asc&limit=200`);
      setMensajes((filas || []).map(f => ({ role: f.role, contenido: f.contenido })));
    } catch (e) { /* si falla, arrancamos con historial vacío */ }
    finally { setCargandoHistorial(false); }
  }
  useEffect(() => { cargarHistorial(); }, [marca]);

  async function guardarMensaje(role, contenido) {
    try {
      await vvFetch("chat_mensajes", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ marca, role, contenido }) });
    } catch (e) { /* si falla el guardado, el chat sigue andando igual en esta sesión */ }
  }

  useEffect(() => {
    if (finRef.current) finRef.current.scrollIntoView({ behavior: "smooth", block: "end" });
  }, [mensajes, cargando]);

  function hablarle() {
    if (!soportaDictado) return;
    if (escuchando && reconocimientoRef.current) { reconocimientoRef.current.stop(); return; }
    const reconocimiento = new MotorVoz();
    reconocimiento.lang = "es-AR";
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;
    reconocimiento.continuous = false;
    reconocimiento.onstart = () => setEscuchando(true);
    reconocimiento.onend = () => { setEscuchando(false); reconocimientoRef.current = null; };
    reconocimiento.onerror = () => { setEscuchando(false); reconocimientoRef.current = null; setError("No pude escucharte bien, probá de nuevo."); };
    reconocimiento.onresult = (ev) => {
      const texto = ev.results[0][0].transcript;
      setPrompt(p => (p ? p.trim() + " " : "") + texto);
    };
    reconocimientoRef.current = reconocimiento;
    reconocimiento.start();
  }

  function limpiarTemporizadoresVoz() {
    if (timeoutSeguridadRef.current) { clearTimeout(timeoutSeguridadRef.current); timeoutSeguridadRef.current = null; }
    if (intervaloResumeRef.current) { clearInterval(intervaloResumeRef.current); intervaloResumeRef.current = null; }
  }

  function detenerLectura() {
    limpiarTemporizadoresVoz();
    window.speechSynthesis.cancel();
    utteranceRef.current = null;
    setHablandoIdx(null);
  }

  function escucharTexto(texto, idx) {
    if (!soportaLectura || !texto) return;
    detenerLectura();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-AR";
    u.onstart = () => setHablandoIdx(idx);
    u.onend = () => { limpiarTemporizadoresVoz(); setHablandoIdx(null); utteranceRef.current = null; };
    u.onerror = () => { limpiarTemporizadoresVoz(); setHablandoIdx(null); utteranceRef.current = null; };
    utteranceRef.current = u;
    window.speechSynthesis.speak(u);
    // Chrome corta el audio a los ~15s en textos largos si no se lo "empuja" — este truco lo evita
    intervaloResumeRef.current = setInterval(() => {
      if (window.speechSynthesis.speaking) { window.speechSynthesis.pause(); window.speechSynthesis.resume(); }
    }, 12000);
    const segundosEstimados = Math.max(8, Math.ceil(texto.length / 12));
    timeoutSeguridadRef.current = setTimeout(() => { detenerLectura(); }, (segundosEstimados + 15) * 1000);
  }

  useEffect(() => {
    return () => {
      limpiarTemporizadoresVoz();
      window.speechSynthesis.cancel();
      if (reconocimientoRef.current) reconocimientoRef.current.stop();
    };
  }, []);

  async function enviar(texto) {
    const limpio = (texto || "").trim();
    if (!limpio || cargando) return;
    const historialNuevo = [...mensajes, { role: "user", contenido: limpio }];
    setMensajes(historialNuevo);
    setPrompt("");
    setCargando(true); setError(""); setNota("");
    guardarMensaje("user", limpio);
    try {
      const { texto: respuesta, empresas, grupos } = await preguntarleAlAsistente(historialNuevo, marca);
      setMensajes(h => [...h, { role: "assistant", contenido: respuesta }]);
      guardarMensaje("assistant", respuesta);
      const notas = [];
      if (empresas && empresas.length > 0) {
        let guardadas = 0;
        for (const e of empresas) {
          try {
            await vvFetch("socios_prospectados", {
              method: "POST", headers: { Prefer: "return=minimal" },
              body: JSON.stringify({
                nombre: e.nombre, marca,
                categoria: e.categoria || "desde asistente",
                zona: e.zona || "",
                sitio_web: e.sitio_web || "", telefono: e.telefono || "", email: e.email || "", fuente: e.fuente || "chat del asistente"
              })
            });
            guardadas++;
          } catch (err) { /* puede ser duplicado, seguimos */ }
        }
        if (guardadas > 0) notas.push(`${guardadas} empresa${guardadas === 1 ? "" : "s"} en Prospección`);
      }
      if (grupos && grupos.length > 0) {
        let guardados = 0;
        for (const g of grupos) {
          try {
            await vvFetch("grupos_barrios", {
              method: "POST", headers: { Prefer: "return=minimal" },
              body: JSON.stringify({
                barrio: g.barrio, marca,
                tipo: g.tipo || "otro",
                contacto: g.contacto || "",
                estado: "por pedir acceso"
              })
            });
            guardados++;
          } catch (err) { /* puede ser duplicado, seguimos */ }
        }
        if (guardados > 0) notas.push(`${guardados} grupo${guardados === 1 ? "" : "s"} en Marketing → Grupos de barrios`);
      }
      if (notas.length > 0) setNota(`✓ Se guardó: ${notas.join(" · ")}.`);
    } catch (e) { setError(e.message); }
    finally { setCargando(false); }
  }

  async function nuevaConversacion() {
    detenerLectura();
    setMensajes([]); setPrompt(""); setError(""); setNota("");
    try { await vvFetch(`chat_mensajes?marca=eq.${encodeURIComponent(marca)}`, { method: "DELETE", headers: { Prefer: "return=minimal" } }); } catch (e) {}
  }

  function accionGrupoPendiente() {
    const pendiente = grupos.find(g => g.estado === "por pedir acceso");
    if (!pendiente) { setError("No hay grupos con estado 'por pedir acceso' en Marketing → Grupos de barrios."); return; }
    enviar(`Redactá un mensaje corto de WhatsApp (en español rioplatense, tono cordial) para pedirle a un vecino o administrador del barrio "${pendiente.barrio}" que me autorice a sumarme al grupo de tipo "${pendiente.tipo || 'comercial/ventas'}". Que sea breve, respetuoso, y deje claro que respetaré las reglas del grupo.`);
  }

  function accionProspectosFrios() {
    const nuevos = prospectos.filter(p => p.estado === "nuevo").slice(0, 15);
    if (nuevos.length === 0) { setError("No hay prospectos en estado 'nuevo' en Comercial."); return; }
    const lista = nuevos.map(p => `- ${p.nombre_contacto || p.empresa || "sin nombre"} (${p.tipo_proyecto || "sin rubro"}, zona: ${p.zona || "sin zona"})`).join("\n");
    enviar(`Tengo estos prospectos sin contactar todavía:\n${lista}\n\nOrdenalos por prioridad de contacto (con un criterio breve de por qué) y sugerime, para los 3 más prioritarios, una primera línea de mensaje personalizada para arrancar la conversación.`);
  }

  function accionCampanaActiva() {
    const activa = campanas.find(c => c.estado === "activa") || campanas[0];
    if (!activa) { setError("No hay campañas cargadas en Marketing → Campañas."); return; }
    enviar(`Redactá una publicación corta para Instagram (con 2-3 emojis, sin ser excesivo) promocionando la campaña "${activa.nombre}" por el canal ${activa.canal || "instagram"}. Que incluya un cierre con llamado a la acción hacia el formulario de contacto de la web.`);
  }

  function copiar(texto, idx) {
    navigator.clipboard.writeText(texto).then(() => { setCopiadoIdx(idx); setTimeout(() => setCopiadoIdx(null), 2000); });
  }

  return (
    <div>
      <Encabezado area="Asistente" titulo="Asistente de IA" />
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16, alignItems: "center" }}>
        <button onClick={accionGrupoPendiente} disabled={cargando} style={btnNuevo}>Mensaje para próximo grupo pendiente</button>
        <button onClick={accionProspectosFrios} disabled={cargando} style={btnNuevo}>Priorizar prospectos sin contactar</button>
        <button onClick={accionCampanaActiva} disabled={cargando} style={btnNuevo}>Post para campaña activa</button>
        {mensajes.length > 0 && (
          <button onClick={nuevaConversacion} style={{ border: "none", background: "none", color: MUTE, fontSize: 11.5, cursor: "pointer", marginLeft: "auto" }}>+ Nueva conversación</button>
        )}
      </div>

      <Tarjeta style={{ display: "flex", flexDirection: "column", padding: 0, overflow: "hidden" }}>
        <div style={{ maxHeight: 460, overflowY: "auto", padding: "18px 18px 4px" }}>
          {cargandoHistorial && <div style={{ fontSize: 12.5, color: MUTE, padding: "10px 0" }}>Cargando conversación anterior…</div>}
          {!cargandoHistorial && mensajes.length === 0 && !cargando && (
            <div style={{ fontSize: 12.5, color: MUTE, padding: "10px 0" }}>Empezá a escribir o tocá 🎙️ Hablarle para arrancar la conversación.</div>
          )}
          {mensajes.map((m, i) => (
            <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start", marginBottom: 14 }}>
              <div style={{ maxWidth: "82%" }}>
                <div style={{
                  background: m.role === "user" ? BRASS : FONDO,
                  color: m.role === "user" ? "#fff" : "#1A1A1A",
                  borderRadius: m.role === "user" ? "14px 14px 3px 14px" : "14px 14px 14px 3px",
                  padding: "11px 14px", fontSize: 13.5, lineHeight: 1.55, whiteSpace: "pre-wrap"
                }}>{m.contenido}</div>
                {m.role === "assistant" && (
                  <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                    <button onClick={() => copiar(m.contenido, i)} style={{ border: "none", background: "none", color: MUTE, fontSize: 10.5, cursor: "pointer" }}>{copiadoIdx === i ? "¡Copiado!" : "Copiar"}</button>
                    {soportaLectura && (
                      <button onClick={() => hablandoIdx === i ? detenerLectura() : escucharTexto(m.contenido, i)} style={{ border: "none", background: "none", color: MUTE, fontSize: 10.5, cursor: "pointer" }}>{hablandoIdx === i ? "⏹️ Detener" : "🔊 Escuchar"}</button>
                    )}
                  </div>
                )}
              </div>
            </div>
          ))}
          {cargando && (
            <div style={{ display: "flex", justifyContent: "flex-start", marginBottom: 14 }}>
              <div style={{ background: FONDO, borderRadius: "14px 14px 14px 3px", padding: "11px 16px", fontSize: 13, color: MUTE }}>Pensando…</div>
            </div>
          )}
          <div ref={finRef} />
        </div>

        {nota && <div style={{ background: "#EAF3EC", color: "#2F7A4F", borderRadius: 9, padding: "9px 12px", fontSize: 12, margin: "0 18px 14px" }}>{nota}</div>}
        {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 9, padding: "9px 12px", fontSize: 12, margin: "0 18px 14px" }}>{error}</div>}

        <div style={{ borderTop: `1px solid ${BORDER}`, padding: 14, display: "flex", gap: 8, alignItems: "flex-end" }}>
          <textarea value={prompt} onChange={e => setPrompt(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(prompt); } }}
            placeholder="Escribí o hablale al asistente…"
            style={{ flex: 1, minHeight: 44, maxHeight: 120, padding: 10, borderRadius: 8, border: `1px solid ${BORDER}`, fontSize: 13, fontFamily: "inherit", resize: "vertical" }} />
          {soportaDictado && (
            <button onClick={hablarle} disabled={escuchando ? false : cargando} style={{
              border: "none", borderRadius: 10, padding: "12px 14px", fontSize: 15, cursor: "pointer",
              background: escuchando ? "#B3261E" : "#EDEFF3", color: escuchando ? "#fff" : NAVY
            }}>🎙️</button>
          )}
          <button onClick={() => enviar(prompt)} disabled={cargando || !prompt.trim()} style={{ ...btnBrass, padding: "12px 20px", opacity: cargando || !prompt.trim() ? 0.6 : 1 }}>
            {cargando ? "…" : "Enviar"}
          </button>
        </div>
        {!soportaDictado && <div style={{ fontSize: 11, color: MUTE, padding: "0 14px 12px" }}>Tu navegador no tiene dictado por voz — podés usar el micrófono del teclado para escribir igual.</div>}
      </Tarjeta>
    </div>
  );
}

// ═══════════════════════ DISEÑO ═══════════════════════
function PanelDiseno() {
  const [marca, setMarca] = useState("V+V Construcciones");
  const [colorAcento, setColorAcento] = useState("#B0894F");
  const [colorFondo, setColorFondo] = useState("#F5F6F8");
  const [logo, setLogo] = useState("");
  const [cargando, setCargando] = useState(true);
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");
  const [guardado, setGuardado] = useState(false);

  async function cargar(m) {
    setCargando(true); setError(""); setGuardado(false);
    try {
      const c = await obtenerConfigMarca(m);
      setColorAcento((c && c.color_acento) || (m === "V+V Construcciones" ? "#B0894F" : "#A9673C"));
      setColorFondo((c && c.color_fondo) || (m === "V+V Construcciones" ? "#F5F6F8" : "#F7F3EC"));
      setLogo((c && c.logo_data_uri) || "");
    } catch (e) { setError(e.message); }
    finally { setCargando(false); }
  }
  useEffect(() => { cargar(marca); }, [marca]);

  function subirLogo(archivo) {
    if (!archivo) return;
    if (archivo.size > 1.5 * 1024 * 1024) { setError("La imagen es muy pesada — usá una de menos de 1.5MB."); return; }
    const lector = new FileReader();
    lector.onload = () => setLogo(lector.result);
    lector.readAsDataURL(archivo);
  }

  async function guardar() {
    setGuardando(true); setError(""); setGuardado(false);
    try {
      await vvFetch("config_marca", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ marca, color_acento: colorAcento, color_fondo: colorFondo, logo_data_uri: logo, actualizado: new Date().toISOString() })
      });
      setGuardado(true);
    } catch (e) { setError(e.message); }
    finally { setGuardando(false); }
  }

  return (
    <div>
      <Encabezado area="Diseño" titulo="Personalizar cada marca" />
      <SubTabs tabs={[{ id: "V+V Construcciones", label: "V+V Construcciones" }, { id: "VIP Deco & Home", label: "VIP Deco & Home" }]} actual={marca} onCambiar={setMarca} />
      {cargando ? <div style={{ fontSize: 12.5, color: MUTE }}>Cargando…</div> : (
        <Tarjeta>
          {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 9, padding: "9px 12px", fontSize: 12, marginBottom: 14 }}>{error}</div>}
          {guardado && <div style={{ background: "#EAF3EC", color: "#2F7A4F", borderRadius: 9, padding: "9px 12px", fontSize: 12, marginBottom: 14 }}>Guardado. Los cambios ya se ven en la landing de {marca}.</div>}

          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: NAVY, marginBottom: 8 }}>Logo</div>
            {logo && <img src={logo} alt="Logo actual" style={{ height: 50, marginBottom: 10, borderRadius: 6 }} />}
            <input type="file" accept="image/*" onChange={e => subirLogo(e.target.files[0])} style={{ fontSize: 12.5 }} />
          </div>

          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", marginBottom: 18 }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: NAVY, marginBottom: 8 }}>Color de acento</div>
              <input type="color" value={colorAcento} onChange={e => setColorAcento(e.target.value)} style={{ width: 60, height: 40, border: "none", borderRadius: 8, cursor: "pointer" }} />
            </div>
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: NAVY, marginBottom: 8 }}>Color de fondo</div>
              <input type="color" value={colorFondo} onChange={e => setColorFondo(e.target.value)} style={{ width: 60, height: 40, border: "none", borderRadius: 8, cursor: "pointer" }} />
            </div>
          </div>

          <button onClick={guardar} disabled={guardando} style={{ ...btnBrass, opacity: guardando ? 0.6 : 1 }}>{guardando ? "Guardando…" : "Guardar cambios"}</button>
        </Tarjeta>
      )}
    </div>
  );
}

// ═══════════════════════ PROSPECCIÓN DE SOCIOS ═══════════════════════
const ZONAS_PROSPECCION = ["CABA", "GBA Norte", "GBA Oeste", "GBA Sur", "La Plata / PBA Interior"];
const CATEGORIAS_PROSPECCION_VV = ["estudio de arquitectura", "desarrollador inmobiliario", "gerenciadora de obra"];
const CATEGORIAS_PROSPECCION_DECO = ["estudio de arquitectura", "interiorista", "empresa de decoración"];

function PanelProspeccion({ onData, marca }) {
  const CATEGORIAS_PROSPECCION = marca === "VIP Deco & Home" ? CATEGORIAS_PROSPECCION_DECO : CATEGORIAS_PROSPECCION_VV;
  const [zonas, setZonas] = useState(["GBA Sur"]);
  const [categorias, setCategorias] = useState([CATEGORIAS_PROSPECCION[0]]);
  const [zonaLibre, setZonaLibre] = useState("");
  const [categoriaLibre, setCategoriaLibre] = useState("");
  const [corriendo, setCorriendo] = useState(false);
  const [log, setLog] = useState([]);
  const [encontrados, setEncontrados] = useState(0);
  const [progreso, setProgreso] = useState({ hecho: 0, total: 0 });
  const [error, setError] = useState("");
  const detenerRef = React.useRef(false);
  const [refrescar, setRefrescar] = useState(0);

  useEffect(() => { setCategorias([CATEGORIAS_PROSPECCION[0]]); }, [marca]);

  function alternar(lista, setLista, valor) {
    setLista(lista.includes(valor) ? lista.filter(x => x !== valor) : [...lista, valor]);
  }

  function agregarZonaLibre() {
    const v = zonaLibre.trim();
    if (!v || zonas.includes(v)) { setZonaLibre(""); return; }
    setZonas(z => [...z, v]);
    setZonaLibre("");
  }

  function agregarCategoriaLibre() {
    const v = categoriaLibre.trim();
    if (!v || categorias.includes(v)) { setCategoriaLibre(""); return; }
    setCategorias(c => [...c, v]);
    setCategoriaLibre("");
  }

  const combos = zonas.length * categorias.length;
  const minutosEstimados = Math.max(1, Math.ceil(combos * 0.75));
  const costoEstimado = (combos * 0.15).toFixed(2);

  async function empezar() {
    if (combos === 0) { setError("Elegí al menos una zona y una categoría."); return; }
    setCorriendo(true); setError(""); setLog([]); setEncontrados(0);
    detenerRef.current = false;
    setProgreso({ hecho: 0, total: combos });

    let total = 0;
    fuera:
    for (const zona of zonas) {
      for (const categoria of categorias) {
        if (detenerRef.current) break fuera;
        setLog(l => [`Buscando ${categoria} en ${zona}…`, ...l].slice(0, 30));
        try {
          const r = await fetch("/api/prospectar", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ zona, categoria })
          });
          const textoCrudo = await r.text();
          let data;
          try { data = JSON.parse(textoCrudo); }
          catch (e) { throw new Error(`Respuesta no-JSON (status ${r.status}): ${textoCrudo.slice(0, 200)}`); }
          if (!r.ok) throw new Error(`(status ${r.status}) ${data.error || "Error en la búsqueda"}`);
          const empresas = data.empresas || [];
          for (const e of empresas) {
            if (!e.nombre) continue;
            try {
              await vvFetch("socios_prospectados", {
                method: "POST", headers: { Prefer: "return=minimal" },
                body: JSON.stringify({ nombre: e.nombre, marca, categoria, zona, sitio_web: e.sitio_web || "", telefono: e.telefono || "", email: e.email || "", fuente: e.fuente || "" })
              });
              total++;
              setEncontrados(total);
            } catch (err) { /* puede ser duplicado, seguimos */ }
          }
          setLog(l => [`  → ${empresas.length} encontradas en ${categoria} / ${zona}`, ...l].slice(0, 30));
        } catch (e) {
          setLog(l => [`  ⚠ error en ${categoria} / ${zona}: ${e.message}`, ...l].slice(0, 30));
        }
        setProgreso(p => ({ ...p, hecho: p.hecho + 1 }));
      }
    }
    setCorriendo(false);
    setRefrescar(r => r + 1);
  }

  function detener() {
    detenerRef.current = true;
    setCorriendo(false);
  }

  return (
    <div>
      <Encabezado area="Prospección" titulo={marca === "VIP Deco & Home" ? "Buscar interioristas y estudios socios" : "Buscar estudios y desarrolladores socios"} />
      <Tarjeta style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 13, color: SUB, marginBottom: 16 }}>
          Elegí dónde y a quién buscar. Se recorre cada combinación de zona/categoría revisando
          sitios de empresas, cámaras del rubro y portales — solo información pública que esas
          empresas publican para ser encontradas. Podés detenerlo en cualquier momento.
        </div>

        <div style={{ fontSize: 11, fontWeight: 700, color: MUTE, marginBottom: 8, letterSpacing: ".06em", textTransform: "uppercase" }}>Dónde buscar</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          {ZONAS_PROSPECCION.map(z => (
            <button key={z} onClick={() => alternar(zonas, setZonas, z)} disabled={corriendo} style={{
              border: `1.5px solid ${zonas.includes(z) ? NAVY : BORDER}`, borderRadius: 20, padding: "8px 14px", fontSize: 12, fontWeight: 700,
              background: zonas.includes(z) ? NAVY : "#fff", color: zonas.includes(z) ? "#fff" : NAVY, cursor: corriendo ? "default" : "pointer"
            }}>{z}</button>
          ))}
          {zonas.filter(z => !ZONAS_PROSPECCION.includes(z)).map(z => (
            <button key={z} onClick={() => alternar(zonas, setZonas, z)} disabled={corriendo} style={{
              border: `1.5px solid ${BRASS}`, borderRadius: 20, padding: "8px 14px", fontSize: 12, fontWeight: 700,
              background: "#FBF3E8", color: "#8A5F1E", cursor: corriendo ? "default" : "pointer"
            }}>{z} ✕</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
          <input value={zonaLibre} onChange={e => setZonaLibre(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); agregarZonaLibre(); } }}
            placeholder="Otra zona (ej: Zárate, Escobar, Tigre)…" disabled={corriendo}
            style={{ ...campoEstilo, flex: "1 1 240px" }} />
          <button onClick={agregarZonaLibre} disabled={corriendo || !zonaLibre.trim()} style={btnNuevo}>+ Agregar</button>
        </div>

        <div style={{ fontSize: 11, fontWeight: 700, color: MUTE, marginBottom: 8, letterSpacing: ".06em", textTransform: "uppercase" }}>A quién buscar</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          {CATEGORIAS_PROSPECCION.map(c => (
            <button key={c} onClick={() => alternar(categorias, setCategorias, c)} disabled={corriendo} style={{
              border: `1.5px solid ${categorias.includes(c) ? BRASS : BORDER}`, borderRadius: 20, padding: "8px 14px", fontSize: 12, fontWeight: 700,
              background: categorias.includes(c) ? "#FBF3E8" : "#fff", color: categorias.includes(c) ? "#8A5F1E" : NAVY, cursor: corriendo ? "default" : "pointer"
            }}>{categorias.includes(c) ? "✓ " : ""}{c}</button>
          ))}
          {categorias.filter(c => !CATEGORIAS_PROSPECCION.includes(c)).map(c => (
            <button key={c} onClick={() => alternar(categorias, setCategorias, c)} disabled={corriendo} style={{
              border: `1.5px solid ${BRASS}`, borderRadius: 20, padding: "8px 14px", fontSize: 12, fontWeight: 700,
              background: "#FBF3E8", color: "#8A5F1E", cursor: corriendo ? "default" : "pointer"
            }}>✓ {c} ✕</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
          <input value={categoriaLibre} onChange={e => setCategoriaLibre(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); agregarCategoriaLibre(); } }}
            placeholder="Otro rubro de empresa (ej: showroom de decoración, corralón)…" disabled={corriendo}
            style={{ ...campoEstilo, flex: "1 1 240px" }} />
          <button onClick={agregarCategoriaLibre} disabled={corriendo || !categoriaLibre.trim()} style={btnNuevo}>+ Agregar</button>
        </div>

        <div style={{ background: FONDO, borderRadius: 10, padding: "12px 14px", fontSize: 12.5, color: SUB, marginBottom: 16 }}>
          <b>{combos}</b> búsqueda{combos === 1 ? "" : "s"} · unos <b>{minutosEstimados}</b> minuto{minutosEstimados === 1 ? "" : "s"} · costo estimado <b>USD {costoEstimado}</b>
          <div style={{ fontSize: 11, color: MUTE, marginTop: 4 }}>El costo es aproximado (uso de la API de Anthropic). Lo encontrado queda guardado aunque detengas la búsqueda.</div>
        </div>

        {error && <div style={{ background: "#FDECEA", color: "#B3261E", borderRadius: 9, padding: "9px 12px", fontSize: 12, marginBottom: 14 }}>{error}</div>}

        {!corriendo ? (
          <button onClick={empezar} style={{ ...btnBrass, width: "100%", padding: "13px 22px" }}>🔍 Empezar a buscar</button>
        ) : (
          <button onClick={detener} style={{ ...btnBrass, width: "100%", padding: "13px 22px", background: "#B3261E" }}>⏹ Detener ({progreso.hecho}/{progreso.total})</button>
        )}

        {(corriendo || log.length > 0) && (
          <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${BORDER}` }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: NAVY, marginBottom: 8 }}>{encontrados} empresa{encontrados === 1 ? "" : "s"} guardada{encontrados === 1 ? "" : "s"}</div>
            <div style={{ maxHeight: 160, overflowY: "auto", fontSize: 11.5, color: MUTE, fontFamily: "monospace", lineHeight: 1.7 }}>
              {log.map((l, i) => <div key={i}>{l}</div>)}
            </div>
          </div>
        )}
      </Tarjeta>

      <ListaGenerica key={marca + "-" + refrescar} tabla="socios_prospectados" etiqueta="empresa" onData={onData}
        filtro={{ campo: "marca", valor: marca }}
        estadoCampo="estado" estadoOpciones={["nuevo", "contactado", "respondió", "acuerdo"]}
        colorEstado={{ nuevo: "#4A5565", contactado: "#9A6B1E", "respondió": "#3B6CA8", acuerdo: "#2F7A4F" }}
        campos={[
          { key: "nombre", label: "Empresa", ancho: "1 1 200px" },
          { key: "categoria", label: "Categoría", tipo: "select", opciones: CATEGORIAS_PROSPECCION },
          { key: "zona", label: "Zona", tipo: "select", opciones: ZONAS_PROSPECCION },
          { key: "sitio_web", label: "Sitio web", ancho: "1 1 180px" },
          { key: "telefono", label: "Teléfono" },
          { key: "email", label: "Mail", ancho: "1 1 180px" }
        ]} />
    </div>
  );
}

const AREAS = [
  { id: "ceo", label: "CEO" },
  { id: "comercial", label: "Comercial" },
  { id: "marketing", label: "Marketing" },
  { id: "prospeccion", label: "Prospección" },
  { id: "operaciones", label: "Operaciones" },
  { id: "soporte", label: "Soporte" },
  { id: "finanzas", label: "Finanzas" },
  { id: "producto", label: "Producto" },
  { id: "seguridad", label: "Seguridad" },
  { id: "asistente", label: "Asistente IA" },
  { id: "diseno", label: "Diseño" }
];

function CentroOperaciones() {
  const [autenticado, setAutenticado] = useState(!!tokenGuardado());
  const [area, setArea] = useState("ceo");
  const [marca, setMarca] = useState("V+V Construcciones");
  const [prospectos, setProspectos] = useState([]);
  const [campanas, setCampanas] = useState([]);
  const [clientesObra, setClientesObra] = useState([]);
  const [ticketsOp, setTicketsOp] = useState([]);
  const [ticketsSop, setTicketsSop] = useState([]);
  const [finanzas, setFinanzas] = useState({ ingresos: [], gastos: [] });
  const [pedidosProducto, setPedidosProducto] = useState([]);
  const [incidentes, setIncidentes] = useState([]);
  const [grupos, setGrupos] = useState([]);

  const prospectosMarca = prospectos.filter(p => (p.marca || "V+V Construcciones") === marca);
  const campanasMarca = campanas.filter(c => (c.marca || "V+V Construcciones") === marca);
  const ingresosMarca = finanzas.ingresos.filter(x => (x.marca || "V+V Construcciones") === marca);
  const gastosMarca = finanzas.gastos.filter(x => (x.marca || "V+V Construcciones") === marca);

  const metricas = {
    prospectos: prospectosMarca.length,
    prospectosCerrados: prospectosMarca.filter(p => p.estado === "cerrado").length,
    campanasActivas: campanasMarca.filter(c => c.estado === "activa").length,
    leadsGenerados: campanasMarca.reduce((a, c) => a + Number(c.leads_generados || 0), 0),
    clientesObra: clientesObra.filter(c => c.etapa !== "entregada").length,
    ticketsAbiertos: ticketsOp.filter(t => t.estado === "abierto").length + ticketsSop.filter(t => t.estado === "abierto").length,
    balance: ingresosMarca.reduce((a, x) => a + Number(x.monto || 0), 0) - gastosMarca.reduce((a, x) => a + Number(x.monto || 0), 0),
    pedidosProducto: pedidosProducto.filter(p => p.estado !== "resuelto").length,
    incidentesSeguridad: incidentes.filter(i => i.estado === "abierto").length
  };

  if (!autenticado) return <LoginForm onLogin={() => setAutenticado(true)} />;

  return (
    <div style={{ minHeight: "100vh" }}>
      <div style={{ background: NAVY, padding: "14px 20px" }}>
        <div style={{ maxWidth: 1000, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <img src={LOGO_VV} alt="V+V Construcciones" style={{ height: 30, display: "block" }} />
          <button onClick={() => { cerrarSesion(); setAutenticado(false); }} style={{ border: "none", background: "none", color: "#8B95A5", fontSize: 11.5, cursor: "pointer" }}>Cerrar sesión</button>
        </div>
      </div>
      <div style={{ background: "#161F30", padding: "10px 20px", borderBottom: "1px solid #26314A" }}>
        <div style={{ maxWidth: 1000, margin: "0 auto", display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 10.5, color: "#8B95A5", fontWeight: 700, letterSpacing: ".06em", textTransform: "uppercase" }}>Trabajando como:</span>
          <div style={{ display: "flex", gap: 6 }}>
            {["V+V Construcciones", "VIP Deco & Home"].map(m => (
              <button key={m} onClick={() => setMarca(m)} style={{
                border: "none", borderRadius: 20, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                background: marca === m ? BRASS : "transparent", color: marca === m ? "#fff" : "#B7BFCC"
              }}>{m}</button>
            ))}
          </div>
        </div>
      </div>
      <div style={{ background: "#0D1420", padding: "10px 20px", overflowX: "auto" }}>
        <div style={{ maxWidth: 1000, margin: "0 auto", display: "flex", gap: 6 }}>
          {AREAS.map(a => (
            <button key={a.id} onClick={() => setArea(a.id)} style={{
              border: "none", borderRadius: 20, padding: "8px 16px", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap",
              background: area === a.id ? BRASS : "transparent", color: area === a.id ? "#fff" : "#B7BFCC"
            }}>{a.label}</button>
          ))}
        </div>
      </div>
      <div style={{ maxWidth: 1000, margin: "0 auto", padding: "28px 20px" }}>
        {area === "ceo" && <PanelCEO metricas={metricas} marca={marca} />}
        {area === "comercial" && <PanelComercial onData={setProspectos} marca={marca} />}
        {area === "marketing" && <PanelMarketing onCampanas={setCampanas} onGrupos={setGrupos} marca={marca} />}
        {area === "prospeccion" && <PanelProspeccion onData={() => {}} marca={marca} />}
        {area === "operaciones" && <PanelOperaciones onData={setClientesObra} />}
        {area === "soporte" && <PanelSoporte onData={setTicketsSop} />}
        {area === "finanzas" && <PanelFinanzas onData={setFinanzas} marca={marca} />}
        {area === "producto" && <PanelProducto onData={setPedidosProducto} />}
        {area === "seguridad" && <PanelSeguridad onData={setIncidentes} />}
        {area === "asistente" && <PanelAsistente prospectos={prospectosMarca} campanas={campanasMarca} grupos={grupos} marca={marca} />}
        {area === "diseno" && <PanelDiseno />}
      </div>
    </div>
  );
}

ReactDOM.render(<Sitio />, document.getElementById("root"));
</script>
